name: CI

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  # release-gate.yml מפעיל כך את הבנייה על התג שיצר: תג שנוצר ב-GITHUB_TOKEN
  # אינו מפעיל workflows בעצמו.
  workflow_dispatch:

jobs:
  helper:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: for file in plugin/js/*.js plugin/i18n/*.js; do node --check "$file"; done
      - name: Unit tests
        run: node --test plugin/test/*.test.js
      # מהמניפסט ולא קבוע כאן: כך הקובץ זהה בכל ענף, ו-release-gate.yml יכול
      # לקדם את main לענף הגרסה (GITHUB_TOKEN אינו רשאי לדחוף שינוי ב-workflow).
      - name: minAppVersion
        id: manifest
        run: echo "min-app-version=$(node -p "require('./plugin/manifest.json').minAppVersion")" >> "$GITHUB_OUTPUT"
      # אותן בדיקות שהחנות מריצה, כולל בדיקת העיצוב. שגיאה מכשילה כאן; את
      # האזהרות בודק השלב הבא.
      - name: Official validator
        id: validator
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: plugin
          app-version: ${{ steps.manifest.outputs.min-app-version }}
          fail-on-warnings: false
          publish: false
      # מותרות רק ההמלצות להסיר הרשאת בסיס מוצהרת (tools/validator-warnings.js).
      - name: Validator warnings
        env:
          WARNINGS: ${{ steps.validator.outputs.total-warnings }}
        run: node tools/validator-warnings.js plugin/manifest.json "$WARNINGS"

  installer:
    needs: [helper, plugin]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            installer/output/*.exe
            installer/staging/*.otzplugin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      # עותק בשם קבוע: הקישור הקבוע למתקין האחרון הוא
      # .../releases/latest/download/OtzariaResponsa-Setup.exe
      - name: Constant-name installer
        run: cp dist/output/OtzariaResponsa-Setup-*.exe dist/OtzariaResponsa-Setup.exe
      # הערות הגרסה מהסעיף שלה ב-CHANGELOG.md, ולא רשימת קומיטים.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## $version" '$0 == head {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || { echo "::error::אין סעיף '## $version' ב-CHANGELOG.md"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/output/*.exe
            dist/OtzariaResponsa-Setup.exe
            dist/staging/*.otzplugin
          body_path: dist/notes.md
          fail_on_unmatched_files: true

  # אחרי ה-Release ולא לפניו: תקלה בחנות (סיסמה, אתר) לא מעכבת את המתקין.
  store:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # בשביל צילום המסך בלבד; התוסף עצמו נלקח מה-Release.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      # הוולידטור מפרסם רק מתיקייה, ולכן פורסים את הקובץ שב-Release. כך
      # החנות מקבלת אותם קבצים בדיוק, ולא בנייה נוספת מהמקור.
      - name: Unpack the released plugin
        run: |
          mkdir -p build/store-plugin
          unzip -q dist/staging/OtzariaResponsa.otzplugin -d build/store-plugin
      # הגרסה מהקובץ שפורסם, ורשימת הצילומים מהענף (store-screenshots.txt),
      # כדי שה-workflow יהיה זהה בכל ענף.
      - name: Store inputs
        id: inputs
        run: |
          echo "min-app-version=$(jq -r .minAppVersion build/store-plugin/manifest.json)" >> "$GITHUB_OUTPUT"
          {
            echo 'screenshots<<EOF'
            grep -v '^\s*\(#\|$\)' .github/store-screenshots.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Store credentials
        id: creds
        env:
          OTZARIA_USER: ${{ secrets.OTZARIA_USER }}
          OTZARIA_PASSWORD: ${{ secrets.OTZARIA_PASSWORD }}
        run: |
          if [ -n "$OTZARIA_USER" ] && [ -n "$OTZARIA_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice::חסרים הסודות OTZARIA_USER / OTZARIA_PASSWORD, ולכן התוסף לא פורסם בחנות."
          {
            echo "### חנות אוצריא: לא פורסם"
            echo
            echo "חסרים הסודות \`OTZARIA_USER\` ו-\`OTZARIA_PASSWORD\`. מוסיפים אותם ב-Settings ← Secrets and variables ← Actions,"
            echo "או \`gh secret set OTZARIA_USER -R ${{ github.repository }}\` (וכך גם הסיסמה), ומריצים שוב את ה-job הזה."
          } >> "$GITHUB_STEP_SUMMARY"
      # בלי סודות `auto` רק מאמת. OTZARIA_PLUGIN_ID ריק עד הפרסום הראשון, ואז
      # הוולידטור מזהה את התוסף לפי ה-id שבמניפסט.
      - name: Publish to the Otzaria store
        id: store
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: build/store-plugin
          app-version: ${{ steps.inputs.outputs.min-app-version }}
          # האזהרות נבדקו ב-job plugin על אותם קבצים; כאן הוולידטור רק מפרסם.
          fail-on-warnings: false
          publish: auto
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}
          otzaria-plugin-id: ${{ vars.OTZARIA_PLUGIN_ID }}
          # צילומי המסך נדרשים ביצירת התוסף בחנות, ו-update-screenshots מחליף
          # אותם בכל גרסה, כדי שהחנות תציג את המסכים העדכניים.
          screenshots: ${{ steps.inputs.outputs.screenshots }}
          update-screenshots: true
          # דיווחי באגים מהמשתמשים נשלחים למייל של חשבון החנות; החנות דורשת
          # את ההסכמה הזו ביצירת תוסף חדש.
          reports-consent: true
      - name: Store result
        if: always() && steps.creds.outputs.configured == 'true'
        env:
          OUTCOME: ${{ steps.store.outcome }}
          PUBLISHED: ${{ steps.store.outputs.published }}
          PENDING: ${{ steps.store.outputs.pending-approval }}
          VERSION: ${{ github.ref_name }}
        run: |
          {
            echo "### חנות אוצריא"
            echo
            if [ "$OUTCOME" != "success" ]; then
              echo "הפרסום נכשל. הסיבה בלוג של השלב \"Publish to the Otzaria store\". ה-Release עצמו כבר פורסם."
            elif [ "$PENDING" = "true" ]; then
              echo "$VERSION נשלח וממתין לאישור מנהל (פרסום ראשון). מזהה התוסף בחנות מופיע בלוג (\"מזהה התוסף החדש בחנות\");"
              echo "הגדירו אותו כמשתנה המאגר \`OTZARIA_PLUGIN_ID\`."
            elif [ "$PUBLISHED" = "true" ]; then
              echo "$VERSION עלה לחנות."
            else
              echo "לא פורסם: הגרסה $VERSION כבר קיימת בחנות."
            fi
            echo
            echo "\`published=$PUBLISHED\` · \`pending-approval=$PENDING\`"
          } >> "$GITHUB_STEP_SUMMARY"
