<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>פרויקט השו"ת (בר אילן)</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-titles">
          <h1 class="topbar-title"></h1>
          <span class="topbar-subtitle"></span>
        </div>
        <div class="topbar-actions">
          <button type="button" class="button button-text show-responsa" hidden></button>
        </div>
      </header>
      <!-- הלשוניות הראשיות. הכפתורים נבנים ב-responsa-view.js. -->
      <div class="main-tabs" role="tablist"></div>
      <!-- main נשאר ציון הדרך של העמוד; הלשונית הנוכחית היא ה-tabpanel שבתוכו. -->
      <main class="app-content">
        <div class="content-column" id="main-panel" role="tabpanel"></div>
      </main>
    </div>

    <!-- אזור קבוע לקורא מסך: אזור שנוצר זה עתה אינו מוכרז. -->
    <div class="live-region visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <!-- מסך הפתיחה בלבד: כל השאר בלשוניות. -->
    <div class="overlay-scrim"></div>
    <section
      class="help-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="welcome-title"
      aria-hidden="true"
    ></section>

    <!-- סדר הטעינה: תרגום → לוגיקה טהורה → שכבות עזר → תצוגה → בקר → כניסה. -->
    <script src="js/responsa-i18n.js"></script>
    <script src="i18n/en.js"></script>
    <script src="js/responsa-domain.js"></script>
    <script src="js/responsa-advanced.js"></script>
    <script src="js/responsa-locate.js"></script>
    <script src="js/responsa-icons.js"></script>
    <script src="js/responsa-theme.js"></script>
    <script src="js/responsa-log.js"></script>
    <script src="js/responsa-runtime.js"></script>
    <script src="js/responsa-settings.js"></script>
    <script src="js/responsa-service.js"></script>
    <script src="js/responsa-engine.js"></script>
    <script src="js/responsa-ui.js"></script>
    <script src="js/responsa-panels.js"></script>
    <script src="js/responsa-advanced-ui.js"></script>
    <script src="js/responsa-locate-ui.js"></script>
    <script src="js/responsa-view.js"></script>
    <script src="js/responsa-app.js"></script>
    <script src="js/responsa-main.js"></script>
  </body>
</html>
